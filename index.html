<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Ritorno dalla banca</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; background: #fafafa; line-height: 1.5; }
  h1 { font-size: 1.3rem; }
  textarea { width: 100%; height: 7em; font-family: ui-monospace, monospace; font-size: .85rem; box-sizing: border-box; }
  button { margin-top: 8px; padding: 10px 16px; font-size: 1rem; }
  .nota { color: #666; font-size: .9rem; }
  @media (prefers-color-scheme: dark) { body { background: #161616; color: #eee; } .nota { color: #aaa; } }
</style>
</head>
<body>
<h1>Consenso ricevuto</h1>
<p>Copia l'indirizzo qui sotto e incollalo a Gino su Telegram entro 30 minuti.</p>
<textarea id="url" readonly></textarea>
<button id="copia" type="button">Copia</button>
<p class="nota">Questa pagina non salva e non invia nulla: l'indirizzo resta solo nel tuo browser.</p>
<script>
  var campo = document.getElementById('url');
  campo.value = window.location.href;
  document.getElementById('copia').addEventListener('click', function () {
    campo.select();
    if (navigator.clipboard) { navigator.clipboard.writeText(campo.value); } else { document.execCommand('copy'); }
    this.textContent = 'Copiato';
  });
</script>
</body>
</html>
